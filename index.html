<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Kue Ulang Tahun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">
        <!-- Wadah Kue (3 Lapisan) -->
        <div class="cake-container">
            <!-- Lapisan Kue Bawah -->
            <div class="cake-layer layer-3"></div>
            <!-- Lapisan Kue Tengah -->
            <div class="cake-layer layer-2"></div>
            <!-- Lapisan Kue Puncak (Lilin dimasukkan di sini agar menancap) -->
            <div class="cake-layer layer-1">
                <div class="candle falling">
                    <div class="flame"></div>
                </div>
            </div>
        </div>

        <!-- Teks Ucapan -->
        <div class="greeting">Happy 6th Anniversary</div>
        <div class="greeting">Yoshi with Septi</div>

        <!-- Cipratan Kembang Api -->
        <div class="fireworks">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

</body>
</html>
